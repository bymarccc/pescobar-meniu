<style>
:root{--bg:#0f1b2a;--gold:#c9a96e;--text:#f4f1ea;--muted:#9fb0c4;--line:rgba(201,169,110,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.35;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.frame{max-width:1180px;margin:0 auto;border:1px solid var(--line);padding:28px 18px 24px}
header{text-align:center;margin-bottom:22px}
h1{color:var(--gold);font-size:2.2rem;letter-spacing:.14em;font-weight:800}
.sub{font-size:.72rem;letter-spacing:.16em;color:var(--text);margin-top:6px}
.rule{width:60%;height:1px;background:var(--line);margin:18px auto 0}
.cols{columns:1;column-gap:44px}
section{break-inside:avoid;margin-bottom:24px}
h2{color:var(--gold);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.note{font-size:.76rem;color:var(--muted);margin:-2px 0 8px}
ul{list-style:none}
li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;font-size:.95rem}
li .n{flex:1}
li .p{color:var(--gold);font-weight:700;white-space:nowrap;text-align:right}
li .p small{color:var(--muted);font-weight:400;font-size:.72rem}
footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.14em;margin-top:8px;text-transform:uppercase}
@media(min-width:700px){.cols{columns:2}h1{font-size:2.8rem}.frame{padding:40px 34px 30px}}
@media(min-width:1050px){.cols{columns:3}li{font-size:.9rem}}
</style>
</head>
