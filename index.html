<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2a">
<title>Meniu • Pește și Fructe de Mare</title>
<meta name="description" content="Meniu: pește, fructe de mare, preparate la grătar.">
<style>
:root{--bg:#0f1b2a;--card:#12223a;--gold:#c9a96e;--text:#f4f1ea;--muted:#9fb0c4;--line:rgba(201,169,110,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.35;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.frame{max-width:1180px;margin:0 auto;border:1px solid var(--line);padding:26px 14px 22px}
header{text-align:center;margin-bottom:22px}
h1{color:var(--gold);font-size:2.4rem;letter-spacing:.14em;font-weight:800}
.sub{font-size:.72rem;letter-spacing:.16em;margin-top:6px}
.rule{width:60%;height:1px;background:var(--line);margin:18px auto 0}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);padding:16px 16px 12px}
h2{color:var(--gold);font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-align:center;margin-bottom:10px}
.note{text-align:center;font-size:.85rem;margin-bottom:6px}
.pick{text-align:center;color:var(--gold);font-weight:700;font-size:.95rem;padding:8px 0;margin:6px 0 4px;border-top:1px solid var(--line)}
ul{list-style:none}
li{display:flex;align-items:baseline;gap:6px;padding:5px 0;font-size:.92rem}
li .n{flex:0 1 auto}
li .d{flex:1;border-bottom:1px dotted rgba(244,241,234,.28);transform:translateY(-3px);min-width:8px}
li .p{color:var(--gold);font-weight:700;white-space:nowrap}
li .p small{color:var(--muted);font-weight:400;font-size:.72rem}
.boil li{padding:6px 0;justify-content:center}
footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.14em;margin-top:20px;text-transform:uppercase}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.frame{padding:36px 30px 26px}h1{font-size:3rem}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}li{font-size:.88rem}}
</style>
</head>
<body>
<div class="frame">
<header>
<h1>MENIU</h1>
<div class="sub">PEȘTE • FRUCTE DE MARE • PREPARATE LA GRĂTAR</div>
<div class="rule"></div>
</header>
<div class="grid" id="g"></div>
<footer>Meniu • Pește și fructe de mare</footer>
</div>
<script>
var P="porție",K="kg";
var D=[
["Aperitive",[["Lacherdă de pălămidă",25,P],["Hummus",41,P],["Hummus cu creveți"],["Icre de crap",28,P],["Icre de știucă",28,P],["Sashimi"],["Nigiri"]]],
["Carne",[["Cotlete de berbecuț"],["Aripioare de pui"],["Kafta"],["Adana",68,P]]],
["Gătit la tavă",[["Hamsie",25,P],["Stavrid",30,P],["Lufăr",100,K],["Barbun",35,P],["Sardine",30,P],["Macrou",35,P],["Pălămidă",35,P],["Merluciu",35,P]]],
["Tocană – Ghiveci",[["Tocană ghiveci de pălămidă",45,P],["Tocană ghiveci de John Dory",65,P],["Tocană ghiveci de somon",55,P],["Tocană ghiveci de sturion",55,P],["Tigaie picantă",67,P],["Tocană de rapane",55,P]]],
["Frigărui",[["Frigărui de miel",89,P],["Frigărui de vită",87,P],["Frigărui de mangalița"]]],
["Pește la sare",[["Doradă la sare",75,"bucată"],["Lup de mare la sare",75,"bucată"]]],
["Steak",[["Steak de ton",200,K],["Steak de rândunică de mare",300,K],["Steak de pește-spadă",300,K],["Steak de sole",300,K],["Steak de John Dory",300,K],["Steak de grouper",300,K],["Steak de caracatiță gătită",300,K],["Steak de caracatiță crudă",250,K]]],
["Seafood boil","boil",["Tentacule de caracatiță","Creveți","Raci","Scoici","Rapane"]],
["Spiadine",[["Spiadină de ton",55,P],["Spiadină de sturion",55,P],["Spiadină de somon",65,P],["Spiadină de pește-călugăr",69,P],["Spiadină de grouper",75,P],["Spiadină de creveți sălbatici",60,P],["Spiadină de calamar cu feta",75,P],["Spiadină de calamar",65,P],["Spiadină de amberjack",75,P]]],
["Spaghete",[["Spaghete vongole veraci",67,P],["Spaghete telline",67,P]]],
["Gătite prăjit",[["Pui de baltă",72,P],["Fritto misto",73,P],["Creveți pane",73,P],["Caraș prăjit",50,K]]],
["Poke",[["Poke cu somon",45,P],["Poke cu ton",45,P],["Poke cu John Dory",45,P]]],
["Direct din mare",[["Pălămidă",35,K],["Sole fresh",200,K],["Rândunică de mare fresh",200,K],["Pește-călugăr fresh",200,K],["John Dory fresh",200,K],["Doradă regală fresh",200,K],["Amberjack fresh",200,K],["Lufăr mare fresh",200,K]]],
["Fructe de mare",[["Picioare de king crab",600,K],["Langustine",530,K],["Homar California",300,K],["Homar albastru",420,K]]],
["Pește butterfly",[["Butterfly lup de mare",150,K],["Butterfly doradă roșie",200,K],["Butterfly doradă",150,K],["Butterfly crap",100,K],["Butterfly chefal",80,K]]]
];
var h="";
D.forEach(function(s){
if(s[1]==="boil"){
h+='<section class="card boil"><h2>'+s[0]+'</h2><p class="note">Porumb, cartofi și ou incluse</p><p class="pick">La alegere — 20 lei / 100 g</p><ul>';
s[2].forEach(function(n){h+="<li><span class=\"n\">"+n+"</span></li>";});
h+="</ul></section>";return;}
h+='<section class="card"><h2>'+s[0]+"</h2><ul>";
s[1].forEach(function(i){h+='<li><span class="n">'+i[0]+'</span><span class="d"></span><span class="p">'+(i[1]?i[1]+" <small>lei / "+i[2]+"</small>":"–")+"</span></li>";});
h+="</ul></section>";});
document.getElementById("g").innerHTML=h;
</script>
</body>
</html>
